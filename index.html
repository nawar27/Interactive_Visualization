<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2ec;
      --ink: #14262b;
      --muted: #52666a;
      --line: #c5d0c8;
      --accent: #0f6e7a;
      --ring: rgba(15, 110, 122, .16);
      --font: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1a1d;
        --ink: #e4ece8;
        --muted: #9db0b0;
        --line: #26393d;
        --accent: #5cc3cf;
        --ring: rgba(92, 195, 207, .14);
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        repeating-radial-gradient(circle at 92% -8%, transparent 0 34px, var(--ring) 34px 35px),
        var(--bg);
      line-height: 1.55;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 4.5rem 1.5rem 3rem; }
    h1 {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
    }
    .intro { color: var(--muted); max-width: 34rem; margin: 0 0 3rem; font-size: 1.1rem; }

    .projects { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .projects li { border-bottom: 1px solid var(--line); }

    .project {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .25rem 1.5rem;
      padding: 1.5rem .25rem;
      color: inherit;
      text-decoration: none;
    }
    .project h2 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
    .project p { grid-column: 1; margin: 0; color: var(--muted); max-width: 32rem; }
    .path {
      grid-row: 1 / span 2;
      grid-column: 2;
      align-self: center;
      font-size: .95rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }
    a.project:hover h2, a.project:focus-visible h2 { color: var(--accent); }
    a.project:hover .path, a.project:focus-visible .path { text-decoration: underline; text-underline-offset: 4px; }
    a.project:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .project.soon { opacity: .55; }
    .project.soon .path { color: var(--muted); font-weight: 400; }

    footer { margin-top: 3rem; color: var(--muted); font-size: .9rem; }

    @media (max-width: 34rem) {
      .project { grid-template-columns: 1fr; }
      .path { grid-row: auto; grid-column: 1; margin-top: .5rem; }
    }
  </style>
</head>
<body>
    <h1>Portfolio of Interactive Visualizations</h1>
    <p>Silakan pilih visualisasi di bawah ini:</p>
    <ul>
        <li><a href="barchartjs/">📊 Bar Chart Visualization</a></li>
        <li><a href="leafletmap/">🗺️ Leaflet Map Visualization</a></li>
    </ul>

    <footer>Setiap proyek berada di folder sendiri dan harus punya file <code>index.html</code>.</footer>
  </main>
</body>
</html>
